version: "3.9"

services:
  # ── WAHA (WhatsApp HTTP API) ──────────────────────────────────────────────
  waha:
    image: devlikeapro/waha-plus:latest-2026.3.2          
    container_name: waha-stickers
    restart: unless-stopped
    ports:
      - "3001:8080"
    volumes:
      - waha_sessions:/app/.sessions
    env_file:
      - .env

  # ── StickerBot ───────────────────────────────────────────────────────────
  stickerbot:
    build: .
    container_name: stickerbot
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - WAHA_URL=http://waha:8080
      - WAHA_SESSION=default
      - PORT=8080
    env_file:
      - .env    

volumes:
  waha_sessions:
